name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "harden/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: QuotaWarmer
  SCHEME: QuotaWarmer

jobs:
  build:
    name: Generate Project and Build
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check localizations
        # Every String Catalog key needs a finished Turkish translation with the
        # same format placeholders as the English key.
        run: python3 scripts/check-localizations.py

      - name: Check outbound hosts
        # Fails when the sources name a host that is not on the allow-list, or
        # when the remote catalog / update check has been switched back on.
        run: python3 scripts/check-egress-hosts.py

      - name: Run regression suites
        # Package.swift compiles the app's Models/Services in place; the three
        # suites in Tests/RegressionTests run as one serialized Swift Testing suite.
        run: swift test

      - name: Build Debug
        run: |
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -derivedDataPath /tmp/QuotaWarmerCIDerivedData \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Release
        run: |
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -derivedDataPath /tmp/QuotaWarmerCIReleaseDerivedData \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package ad-hoc signed app
        # Ad-hoc signature ("-") so the app launches on Apple Silicon. It is not
        # notarized: after downloading, clear the quarantine flag before opening.
        run: |
          set -euo pipefail
          APP_PATH=$(find /tmp/QuotaWarmerCIReleaseDerivedData -name "${APP_NAME}.app" -maxdepth 8 | head -1)
          test -d "${APP_PATH}"
          # Inside out, never --deep: a deep re-sign would drop the widget's
          # sandbox entitlements, and macOS does not load an unsandboxed widget.
          APPEX="${APP_PATH}/Contents/PlugIns/QuotaWarmerWidget.appex"
          test -d "${APPEX}"
          codesign --force --sign - \
            --entitlements Sources/QuotaWarmerWidget/QuotaWarmerWidget.entitlements "${APPEX}"
          codesign --force --sign - "${APP_PATH}"
          codesign -d --entitlements - "${APPEX}" > /tmp/widget-entitlements.txt 2>/dev/null
          grep -q "com.apple.security.app-sandbox" /tmp/widget-entitlements.txt
          codesign --verify --deep --strict "${APP_PATH}"
          ditto -c -k --keepParent "${APP_PATH}" "${APP_NAME}.zip"
          shasum -a 256 "${APP_NAME}.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: QuotaWarmer-${{ github.sha }}
          path: QuotaWarmer.zip
          retention-days: 14
          if-no-files-found: error
